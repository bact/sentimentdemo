[build-system]
# hatchling capped below 1.32.1: that release requires two generic type params on
# BuildHookInterface, which pitloom's build hook (still at one) can't satisfy.
requires = ["hatchling>=1.32.0,<1.32.1", "pitloom>=0.18.0"]
build-backend = "hatchling.build"

[project]
name = "sentimentdemo"
dynamic = ["version"]
description = "A simple sentiment analysis application, published solely as an artifact for the purpose of demonstrating and testing a software bill of materials. Not recommended for any text classification tasks."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "CC0-1.0"
keywords = [
    "sbom",
    "bom",
    "aibom",
    "spdx",
    "software bill of materials",
    "artificial intelligence",
    "machine learning",
    "natural language processing",
    "sentiment analysis",
    "ai",
    "nlp",
]
authors = [{ name = "Arthit Suriyawongkul", email = "suriyawa@tcd.ie" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fasttext-community>=0.11.8",
    "newmm-tokenizer==0.2.2",
    "numpy>=2.3.3",
    "pitloom>=0.18.0",
    "th-simple-preprocessor==0.10.1",
]

[project.optional-dependencies]
dev = ["mypy>=2.3.1", "pylint>=4.0.8", "pytest>=9.1.1"]
eval = ["scikit-learn>=1.9.1"]

[project.urls]
homepage = "https://github.com/bact/sentimentdemo"
source = "https://github.com/bact/sentimentdemo.git"
download = "https://github.com/bact/sentimentdemo/releases"
releasenotes = "https://github.com/bact/sentimentdemo/releases"
documentation = "https://github.com/bact/sentimentdemo#readme"
issues = "https://github.com/bact/sentimentdemo/issues"

[tool.coverage.paths]
sentimentdemo = ["src/sentimentdemo", "*/sentimentdemo/src/sentimentdemo"]
tests = ["tests", "*/sentimentdemo/tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == '__main__':",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
source_pkgs = ["sentimentdemo"]
branch = true
parallel = true
omit = ["src/sentimentdemo/__about__.py"]

[tool.hatch.build.hooks.pitloom]
enabled = true

[tool.hatch.envs.test]
extra-dependencies = [
    "coverage[toml]==7.16.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
# hatch run test:cov
cov = 'pytest --cov-report=term-missing --cov-config=pyproject.toml --cov=tests'

[tool.hatch.envs.types]
extra-dependencies = ["mypy>=2.3.1"]

[[tool.hatch.envs.types.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.types.scripts]
# hatch run types:check
check = "mypy --install-types --non-interactive {args:src/sentimentdemo tests}"

[tool.hatch.version]
path = "src/sentimentdemo/__about__.py"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["fasttext", "newmm_tokenizer.*", "th_preprocessor.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pitloom.content-type]
enabled = true

[[tool.pitloom.creator]]
name = "Arthit Suriyawongkul"
email = "suriyawa@tcd.ie"

[tool.pitloom.fragment]
files = [
    "fragments/evaluate.spdx3.json",
    "fragments/predict.spdx3.json",
    "fragments/preprocess.spdx3.json",
    "fragments/train.spdx3.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
